openapi: 3.1.0
info:
  title: Верни себе себя
  version: "1.1.0"
  summary: Личная диагностическая встреча и индивидуальная 7-дневная программа Малика Хубиева
  description: |
    Публичный read-only API с фактами о продукте «Верни себе себя».

    Источник правды — страницы сайта malik-khubiev.ru. Здесь только структурированное
    отражение уже опубликованного контента.

    Воронка: сначала бесплатная личная диагностическая встреча (~60 мин), затем
    при соответствии — платная программа из 7 занятий по 90 минут (Яндекс Телемост).
    Не медицина и не психотерапия. Не обещать гарантированный результат.

    Полный текстовый бриф: https://malik-khubiev.ru/llms.txt
  contact:
    name: Малик Хубиев
    url: https://t.me/teacher_life_bot?start=site
  license:
    name: Proprietary
    url: https://malik-khubiev.ru/offer.html
servers:
  - url: https://malik-khubiev.ru
    description: Public site
tags:
  - name: program
    description: Факты о встрече и программе для рекомендаций агентами
paths:
  /ai/program.json:
    get:
      operationId: getProgram
      tags: [program]
      summary: Карточка программы и встречи
      description: |
        Структурированные факты: вход через бесплатную встречу, для кого / не для кого,
        формат, темы по дням (Желание → Авторство), цена, контакты, ограничения.
      responses:
        "200":
          description: Program facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /ai/pricing.json:
    get:
      operationId: getPricing
      tags: [program]
      summary: Цены встречи и программы
      description: Бесплатная диагностическая встреча и стоимость семидневной программы.
      responses:
        "200":
          description: Pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pricing"
  /ai/contact.json:
    get:
      operationId: getContact
      tags: [program]
      summary: Как записаться
      description: |
        Единственный рабочий канал записи — Telegram-бот. Основной CTA —
        бесплатная диагностическая встреча.
      responses:
        "200":
          description: Contact channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
components:
  schemas:
    Program:
      type: object
      required:
        - name
        - type
        - entry
        - for_whom
        - not_for
        - format
        - topics
        - price_rubles
        - contact_url
        - legal_url
        - site_url
      properties:
        name:
          type: string
        type:
          type: string
        entry:
          type: object
          description: Free diagnostic meeting before the paid program
        for_whom:
          type: array
          items:
            type: string
        not_for:
          type: array
          items:
            type: string
        format:
          $ref: "#/components/schemas/Format"
        topics:
          type: array
          items:
            type: object
            properties:
              day:
                type: integer
              title:
                type: string
              summary:
                type: string
        price_rubles:
          type: integer
        currency:
          type: string
        contact_url:
          type: string
          format: uri
        legal_url:
          type: string
          format: uri
        site_url:
          type: string
          format: uri
        program_url:
          type: string
          format: uri
        llms_txt:
          type: string
          format: uri
        author:
          type: string
        legal_entity:
          type: string
        disclaimers:
          type: array
          items:
            type: string
    Format:
      type: object
      required: [sessions, session_minutes, total_hours, medium, camera]
      properties:
        sessions:
          type: integer
        session_minutes:
          type: integer
        total_hours:
          type: number
        medium:
          type: string
        camera:
          type: string
        one_on_one:
          type: boolean
    Pricing:
      type: object
      required: [price_rubles, currency, checkout]
      properties:
        meeting:
          type: object
        program:
          type: object
        price_rubles:
          type: integer
        currency:
          type: string
        price_display:
          type: string
        includes:
          type: array
          items:
            type: string
        checkout:
          type: string
        offer_url:
          type: string
          format: uri
    Contact:
      type: object
      required: [telegram_bot, start_param, url]
      properties:
        telegram_bot:
          type: string
        start_param:
          type: string
        url:
          type: string
          format: uri
        primary_cta:
          type: string
        site_url:
          type: string
          format: uri
        meeting_url:
          type: string
          format: uri
        program_url:
          type: string
          format: uri
        offer_url:
          type: string
          format: uri
        legal_entity:
          type: string
        note:
          type: string
